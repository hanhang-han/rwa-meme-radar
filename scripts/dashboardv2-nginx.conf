# Included inside the cliperx.com HTTPS server block by deploy-dashboard-v2.sh.
# A specific API location must precede the static dashboard location.
location = /dashboardv2 {
    return 301 /dashboardv2/;
}

location ^~ /dashboardv2/api/ {
    proxy_pass http://127.0.0.1:8010/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Accept-Encoding $http_accept_encoding;
    proxy_buffering off;
    proxy_read_timeout 75s;
}

location ^~ /dashboardv2/assets/ {
    alias /opt/memedashboard/web-v2/dist/assets/;
    add_header Cache-Control "public, max-age=2592000, immutable" always;
}

location ^~ /dashboardv2/ {
    alias /opt/memedashboard/web-v2/dist/;
    index index.html;
    try_files $uri $uri/ /dashboardv2/index.html;
    add_header Cache-Control "no-cache, must-revalidate" always;
}
